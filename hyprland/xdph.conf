screencopy {
    # DMA-BUF fixation fails on xdph 1.4.1 (stream dies, or sticks on
    # "Building modifiers for dma"). SHM is the path that actually delivers frames.
    force_shm = true
    # Remember a previous share so Discord / Vesktop do not open the picker
    # three times for the same session (video + audio + restore).
    allow_token_by_default = true
    # Vesktop doesn't request a cursor mode; 2 = embed the cursor into the stream.
    cursor_mode = 2
}
